<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Wynik Rezerwacji</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; text-align: center; }
        .container { max-width: 600px; margin: auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .message { font-size: 1.2em; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Status operacji</h2>
    <div class="message" th:text="${message}">Tu pojawi się status</div>
    <br>
    <a th:href="@{/}" style="color: #3498db; text-decoration: none;">&larr; Wróć do listy koncertów</a>
</div>
</body>
</html>
