<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>System Rezerwacji Biletów</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #333; text-align: center; }
        .event-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        .event-title { font-size: 1.2em; font-weight: bold; color: #2c3e50; }
        .event-date { color: #7f8c8d; }
    </style>
</head>
<body>

<div class="container">
    <h1>Kup Bilet na Koncert</h1>

    <h2>Dostępne wydarzenia:</h2>

    <div th:each="event : ${events}" class="event-card">
        <div class="event-title" th:text="${event.name}">Nazwa Wydarzenia</div>
        <div class="event-date" th:text="'Data: ' + ${#temporals.format(event.eventDate, 'dd-MM-yyyy HH:mm')}">Data</div>
        <a th:href="@{/book(eventId=${event.id})}" style="display: inline-block; margin-top: 10px; padding: 8px 15px; background: #3498db; color: white; text-decoration: none; border-radius: 4px;">Kup bilet</a>
    </div>
</div>

</body>
</html>
