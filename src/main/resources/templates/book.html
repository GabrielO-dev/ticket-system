<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formularz Rezerwacji</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { background-color: #2ecc71; color: white; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div class="container mt-5">
    <h2>Dane rezerwacji</h2>
    <form th:action="@{/book}" th:object="${bookingRequest}" method="post">

        <input type="hidden" th:field="*{eventId}" />

        <div class="mb-3">
            <label class="form-label">Imię i nazwisko:</label>
            <input type="text" class="form-control" th:field="*{customerName}" />
            <div class="text-danger mt-1 fw-bold" th:if="${#fields.hasErrors('customerName')}" th:errors="*{customerName}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Typ biletu:</label>
            <select class="form-select" th:field="*{ticketType}" required>
                <option th:if="${#lists.isEmpty(availablePools)}" value="" disabled selected>Brak biletów na to wydarzenie</option>

                <option th:each="pool : ${availablePools}"
                        th:value="${pool.ticketType}"
                        th:text="${pool.ticketType} + ' - ' + ${pool.price} + ' PLN (Dostępnych: ' + ${pool.availableTickets} + ')'">
                </option>
            </select>
        </div>

        <button type="submit" class="btn btn-success w-100">Potwierdź rezerwację</button>
    </form>
</div>
</body>
</html>
